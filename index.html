<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Líneas y Saldo - Yune</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --bg: #f1f2f6;
            --white: #ffffff;
            --success: #2ed573;
            --whatsapp: #25d366;
            --danger: #ff6b81;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 5px;
            font-size: 22px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        /* Indicador de Ronda Actual */
        .ronda-indicator {
            background: #2f3542;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--secondary);
            margin: 15px 0 8px 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 3px;
        }
        .actions-top {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-whatsapp { background-color: var(--whatsapp); color: white; flex: 1; }
        .btn-clear { background-color: var(--secondary); color: white; flex: 1; }
        .btn-add { background-color: var(--success); color: white; }
        .btn-delete { background-color: var(--primary); color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
        
        .danger-zone {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 2px dashed #ff4757;
            text-align: center;
        }
        .btn-reset-day { 
            background-color: #ff4757; 
            color: white; 
            width: 100%; 
            padding: 12px;
            font-size: 14px;
        }
        
        .line-row {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }
        .line-number {
            font-weight: bold;
            font-size: 15px;
            color: var(--primary);
            width: 40px;
            flex-shrink: 0;
        }
        .line-select {
            flex-grow: 1;
            padding: 7px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .line-select:focus { border-color: var(--primary); }

        .premios-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .premio-box {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }
        .premio-box label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 3px;
        }
        .premio-box input, .premio-box select {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .registry-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
            margin-bottom: 10px;
        }
        .registry-input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .registry-input-row input {
            flex-grow: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .jugadora-tag {
            display: inline-flex;
            align-items: center;
            background: white;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 6px;
            margin: 2px;
            font-size: 13px;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Líneas - Yune</h2>
    <p class="subtitle">Gestión limpia y organizada</p>

    <!-- INDICADOR DE RONDA -->
    <div class="ronda-indicator" id="display-ronda">RONDA 1</div>

    <!-- ADMINISTRAR JUGADORAS FIJAS -->
    <div class="section-title">Mis Jugadoras Habituales</div>
    <div class="registry-box">
        <div class="registry-input-row">
            <input type="text" id="nueva_jugadora_nombre" placeholder="Nombre de la jugadora...">
            <button class="btn-add" onclick="agregarJugadoraFija()">+ Agregar</button>
        </div>
        <div id="lista-jugadoras-fijas">
            <em>No hay jugadoras fijas registradas. Añade una arriba.</em>
        </div>
    </div>

    <!-- ACCIONES DE LÍNEAS -->
    <div class="actions-top" style="margin-top: 15px;">
        <button class="btn-whatsapp" onclick="copiarWhatsApp()">📋 Copiar para WhatsApp</button>
        <button class="btn-clear" onclick="limpiarLineasRonda()">🧹 Vaciar Líneas</button>
    </div>

    <div class="section-title">Asignación de las 15 Líneas (Ronda Actual)</div>
    <div id="lista-lineas"></div>

    <!-- PREMIOS -->
    <div class="section-title">Registro de Premios de la Ronda</div>
    <div class="premios-grid">
        <div class="premio-box">
            <label>1era Línea</label>
            <select id="ganadora_1" class="select-ganadora"><option value="">-- Seleccionar --</option></select>
            <input type="number" id="monto_1" placeholder="Premio" style="margin-top:5px;">
        </div>
        <div class="premio-box">
            <label>2da Línea</label>
            <select id="ganadora_2" class="select-ganadora"><option value="">-- Seleccionar --</option></select>
            <input type="number" id="monto_2" placeholder="Premio" style="margin-top:5px;">
        </div>
        <div class="premio-box">
            <label>3era Línea</label>
            <select id="ganadora_3" class="select-ganadora"><option value="">-- Seleccionar --</option></select>
            <input type="number" id="monto_3" placeholder="Premio" style="margin-top:5px;">
        </div>
        <div class="premio-box">
            <label>4ta Línea</label>
            <select id="ganadora_4" class="select-ganadora"><option value="">-- Seleccionar --</option></select>
            <input type="number" id="monto_4" placeholder="Premio" style="margin-top:5px;">
        </div>
    </div>
    <button class="btn-whatsapp" onclick="guardarRonda()" style="width:100%; margin-bottom: 10px;">💾 Guardar Premios y Avanzar Ronda</button>

    <!-- SALDOS -->
    <div class="section-title">Saldos Positivos Acumulados</div>
    <div id="lista-saldos" style="font-size: 14px; background: #f8f9fa; padding: 8px; border-radius: 8px; margin-bottom: 10px;">
        <em>Aún no hay saldos acumulados.</em>
    </div>

    <!-- ZONA DE PELIGRO -->
    <div class="danger-zone">
        <button class="btn-reset-day" onclick="reiniciarDia()">⚠️ Reiniciar Día (Borrar Todo y Saldos)</button>
    </div>
</div>

<script>
    const totalLineas = 15;

    function obtenerRondaActual() {
        return parseInt(localStorage.getItem('numero_ronda') || '1');
    }

    function actualizarIndicadorRonda() {
        let ronda = obtenerRondaActual();
        document.getElementById('display-ronda').textContent = `RONDA ${ronda}`;
    }

    function obtenerJugadorasFijas() {
        return JSON.parse(localStorage.getItem('jugadoras_fijas') || '[]');
    }

    function guardarJugadorasFijas(lista) {
        localStorage.setItem('jugadoras_fijas', JSON.stringify(lista));
    }

    function agregarJugadoraFija() {
        let input = document.getElementById('nueva_jugadora_nombre');
        let nombre = input.value.trim();
        if (nombre === "") return;

        let lista = obtenerJugadorasFijas();
        if (!lista.includes(nombre)) {
            lista.push(nombre);
            lista.sort();
            guardarJugadorasFijas(lista);
            input.value = "";
            actualizarTodo();
        } else {
            alert("Esta jugadora ya está en tu lista fija.");
        }
    }

    function eliminarJugadoraFija(nombre) {
        if (confirm(`¿Seguro que deseas eliminar a ${nombre} de tus jugadoras fijas?`)) {
            let lista = obtenerJugadorasFijas();
            lista = lista.filter(j => j !== nombre);
            guardarJugadorasFijas(lista);
            actualizarTodo();
        }
    }

    function renderizarJugadorasFijas() {
        let contenedorFijas = document.getElementById('lista-jugadoras-fijas');
        let lista = obtenerJugadorasFijas();

        if (lista.length === 0) {
            contenedorFijas.innerHTML = "<em>No hay jugadoras fijas registradas. Añade una arriba.</em>";
            return;
        }

        let html = "";
        lista.forEach(nombre => {
            html += `<span class="jugadora-tag">${nombre} <button class="btn-delete" onclick="eliminarJugadoraFija('${nombre}')">X</button></span>`;
        });
        contenedorFijas.innerHTML = html;
    }

    function renderizarLineas() {
        let contenedorLineas = document.getElementById('lista-lineas');
        contenedorLineas.innerHTML = '';
        let listaFijas = obtenerJugadorasFijas();

        for (let i = 1; i <= totalLineas; i++) {
            let guardado = localStorage.getItem('linea_ronda_' + i) || '';

            let row = document.createElement('div');
            row.className = 'line-row';

            let num = document.createElement('div');
            num.className = 'line-number';
            num.textContent = '#' + i;

            let select = document.createElement('select');
            select.className = 'line-select';
            select.id = 'select_linea_' + i;

            let optDefault = document.createElement('option');
            optDefault.value = "";
            optDefault.textContent = "-- Disponible --";
            select.appendChild(optDefault);

            listaFijas.forEach(nombre => {
                let opt = document.createElement('option');
                opt.value = nombre;
                opt.textContent = nombre;
                if (nombre === guardado) opt.selected = true;
                select.appendChild(opt);
            });

            select.addEventListener('change', function() {
                localStorage.setItem('linea_ronda_' + i, select.value);
            });

            row.appendChild(num);
            row.appendChild(select);
            contenedorLineas.appendChild(row);
        }
    }

    function actualizarSelectsPremios() {
        let listaFijas = obtenerJugadorasFijas();
        for (let p = 1; p <= 4; p++) {
            let sel = document.getElementById('ganadora_' + p);
            let actual = sel.value;
            sel.innerHTML = '<option value="">-- Seleccionar --</option>';
            listaFijas.forEach(nombre => {
                let opt = document.createElement('option');
                opt.value = nombre;
                opt.textContent = nombre;
                if (nombre === actual) opt.selected = true;
                sel.appendChild(opt);
            });
        }
    }

    function actualizarTodo() {
        actualizarIndicadorRonda();
        renderizarJugadorasFijas();
        renderizarLineas();
        actualizarSelectsPremios();
        mostrarSaldos();
    }

    function copiarWhatsApp() {
        let rondaActual = obtenerRondaActual();
        let texto = `📋 *LISTA DE LÍNEAS - RONDA ${rondaActual}* 📋\n\n`;
        let asignadas = 0;

        for (let i = 1; i <= totalLineas; i++) {
            let val = document.getElementById('select_linea_' + i).value.trim();
            if (val !== "") {
                texto += `${i} - *${val}*\n`;
                asignadas++;
            } else {
                texto += `${i} - _Disponible_\n`;
            }
        }
        texto += `\nTotal asignadas: ${asignadas}/15`;

        navigator.clipboard.writeText(texto).then(() => {
            alert("¡Lista copiada para WhatsApp de forma limpia!");
        });
    }

    function limpiarLineasRonda() {
        if (confirm("¿Vaciar las 15 líneas de esta ronda?")) {
            for (let i = 1; i <= totalLineas; i++) {
                localStorage.removeItem('linea_ronda_' + i);
            }
            renderizarLineas();
        }
    }

    function guardarRonda() {
        let saldos = JSON.parse(localStorage.getItem('saldos_jugadoras') || '{}');
        let registradas = 0;

        for (let p = 1; p <= 4; p++) {
            let nombre = document.getElementById('ganadora_' + p).value.trim();
            let monto = parseFloat(document.getElementById('monto_' + p).value) || 0;

            if (nombre !== "" && monto > 0) {
                if (!saldos[nombre]) saldos[nombre] = 0;
                saldos[nombre] += monto;
                registradas++;
            }
        }

        if (registradas > 0) {
            localStorage.setItem('saldos_jugadoras', JSON.stringify(saldos));
            
            // Limpiar campos de premios
            for (let p = 1; p <= 4; p++) {
                document.getElementById('ganadora_' + p).value = '';
                document.getElementById('monto_' + p).value = '';
            }

            // Limpiar las 15 líneas para prepararlas para la siguiente ronda
            for (let i = 1; i <= totalLineas; i++) {
                localStorage.removeItem('linea_ronda_' + i);
            }

            // Incrementar el número de la ronda automáticamente
            let nuevaRonda = obtenerRondaActual() + 1;
            localStorage.setItem('numero_ronda', nuevaRonda);

            actualizarTodo();
            alert(`¡Ronda guardada con éxito! Pasando automáticamente a la Ronda ${nuevaRonda}.`);
        } else {
            alert("Por favor selecciona al menos una ganadora y su monto.");
        }
    }

    function mostrarSaldos() {
        let divSaldos = document.getElementById('lista-saldos');
        let saldos = JSON.parse(localStorage.getItem('saldos_jugadoras') || '{}');
        let keys = Object.keys(saldos);

        if (keys.length === 0) {
            divSaldos.innerHTML = "<em>Aún no hay saldos acumulados.</em>";
            return;
        }

        let html = "";
        keys.forEach(nombre => {
            html += `<b>${nombre}:</b> +${saldos[nombre]}<br>`;
        });
        divSaldos.innerHTML = html;
    }

    function reiniciarDia() {
        let confirmacion1 = confirm("⚠️ ¿Estás COMPLETAMENTE SEGURA de reiniciar el día? Esto borrará todos los saldos, las líneas y pondrá la ronda en 1.");
        if (confirmacion1) {
            let confirmacion2 = prompt("Escribe la palabra 'BORRAR' para confirmar el reinicio total:");
            if (confirmacion2 && confirmacion2.toUpperCase() === "BORRAR") {
                for (let i = 1; i <= totalLineas; i++) {
                    localStorage.removeItem('linea_ronda_' + i);
                }
                localStorage.removeItem('saldos_jugadoras');
                localStorage.setItem('numero_ronda', '1');
                actualizarTodo();
                alert("¡Día reiniciado con éxito y vuelta a la Ronda 1!");
            } else {
                alert("Operación cancelada. Tus datos están a salvo.");
            }
        }
    }

    actualizarTodo();
</script>

</body>
</html>
